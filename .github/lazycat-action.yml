version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/flare.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: flare-app

build:
  run_buildscript: false

images:
  # 主应用：上游 flintsh/flare 有完整三段 SemVer tag（1.0.0~2.0.0），排除 latest/rolling/-amd64 等别名
  - id: flare-app
    target: service
    service: flare-app
    source: flintsh/flare
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
  # 辅助 postgres：跟随上游 compose 的 postgres:16-alpine 家族，tag 带后缀 → custom + 版本映射
  - id: flare-postgres
    target: service
    service: flare-postgres
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^16\.\d+-alpine$'
    version_regex: '^(?P<version>16\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Flare
    summary: "一个现代的自托管文件共享平台"
